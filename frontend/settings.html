<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — EcoDrive</title>
  <meta name="description" content="Configure pricing defaults and privacy controls.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container app-content-offset" style="max-width:780px;">
    <div class="page-header">
      <div class="page-title-group">
        <h1>Account &amp; Pricing Settings</h1>
        <p>Configure fuel unit pricing defaults and community privacy controls.</p>
      </div>
    </div>

    <div class="card-specular" style="padding:2.25rem; background:#0b0b12;">
      <div id="settings-alert" class="toast toast-error" style="display:none; margin-bottom:1.5rem; position:static; width:100%;"></div>

      <form id="settings-form">
        <h3 style="margin-bottom:1.25rem; font-size:1.2rem;">Profile Configuration</h3>
        <div class="grid-2" style="gap:1rem;">
          <div class="form-group">
            <label for="name">Account Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="goal">Primary Goal</label>
            <select id="goal" class="form-control">
              <option value="save_fuel">Save Fuel / Reduce Expenses</option>
              <option value="reduce_emissions">Reduce Carbon Footprint &amp; CO2</option>
              <option value="improve_skills">Improve Driving Smoothness &amp; Safety</option>
              <option value="general">General Eco Driving Intelligence</option>
            </select>
          </div>
        </div>

        <h3 style="margin-top:1.75rem; margin-bottom:1.25rem; font-size:1.2rem;">Fuel &amp; Energy Unit Pricing Config</h3>
        <div class="grid-2" style="gap:1rem;">
          <div class="form-group">
            <label for="fuelPriceConfig">Fuel Price ($/L)</label>
            <input type="number" step="0.01" id="fuelPriceConfig" class="form-control" placeholder="1.50">
          </div>
          <div class="form-group">
            <label for="electricityPriceConfig">Electricity Price ($/kWh)</label>
            <input type="number" step="0.01" id="electricityPriceConfig" class="form-control" placeholder="0.15">
          </div>
        </div>

        <h3 style="margin-top:1.75rem; margin-bottom:1.25rem; font-size:1.2rem;">Privacy &amp; Leaderboard Controls</h3>
        <div class="form-group">
          <label for="displayName">Public Display Name (Leave empty to use account name)</label>
          <input type="text" id="displayName" class="form-control" placeholder="e.g. Alex (Eco Driver)">
        </div>

        <div style="display:flex; flex-direction:column; gap:0.85rem; margin-bottom:1.75rem;">
          <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; color:#cbd5e1;">
            <input type="checkbox" id="hideProfile" style="accent-color:var(--primary);">
            <span>Hide my profile details from public driver listings</span>
          </label>
          <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; color:#cbd5e1;">
            <input type="checkbox" id="optOutLeaderboard" style="accent-color:var(--primary);">
            <span>Opt-out of all community leaderboards entirely</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
          Save Settings &rarr;
        </button>
      </form>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
